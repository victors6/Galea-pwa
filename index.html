async function sb(path, opts={}) {
  const url = SUPABASE_URL + "/rest/v1/" + path;
  const res = await fetch(url, {
    ...opts,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=representation",
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) throw new Error(await res.text());
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

let nextId = 300;
function uid() { return ++nextId; }
function hoy() { return new Date().toLocaleDateString("es-MX"); }
function fm(n) { return "$"+Number(n).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pc(n) { return (n*100).toFixed(1)+"%"; }
function b64file(f) { return new Promise((ok,er)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=er;r.readAsDataURL(f);}); }
function stSt(a) { if(a.stock<=a.min)return"rep"; if(a.stock>=a.max)return"sob"; return"ok"; }
function catC(c) { return c==="Carnes"?RED:c==="Lacteos"||c==="Mariscos"?BLUE:c==="Verduras"||c==="Frutas"?GREEN:c==="Especias"||c==="Salsas"?PUR:YEL; }
function fcC(f) { return f<=0.25?GREEN:f<=0.35?YEL:RED; }
function fcL(f) { return f<=0.25?"Estrella":f<=0.35?"Rentable":f<=0.45?"Revisar":"Perdida"; }
function subCosto(sub,alm) { const t=sub.ings.reduce((s,l)=>{const i=alm.find(a=>a.id===l.id);return s+(i?i.precio*l.q:0);},0);return sub.rend>0?t/sub.rend:0; }
function recCosto(rec,alm,subs) { return rec.lineas.reduce((s,l)=>{if(l.t==="ING"){const i=alm.find(a=>a.id===l.i);return s+(i?i.precio*l.q:0);}const sub=subs.find(sr=>sr.id===l.i);return s+(sub?subCosto(sub,alm)*l.q:0);},0); }

function Login({onLogin}){
  const [nombre,setNombre]=useState("");
  const [pass,setPass]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");

  async function doLogin(){
    if(!nombre.trim()||!pass.trim())return;
    setLoading(true);setError("");
    try{
      const rows=await sb(`usuarios?nombre=eq.${encodeURIComponent(nombre.trim())}&activo=eq.true&select=*`);
      if(!rows||rows.length===0){setError("Usuario no encontrado o inactivo");return;}
      const user=rows[0];
      if(user.password!==pass){setError("Contraseña incorrecta");return;}
      sessionStorage.setItem("galea_user",JSON.stringify({id:user.id,nombre:user.nombre,rol:user.rol}));
      onLogin({id:user.id,nombre:user.nombre,rol:user.rol});
    }catch(e){setError("Error al conectar: "+e.message);}
    finally{setLoading(false);}
  }

  function onKey(e){if(e.key==="Enter")doLogin();}

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#07080F 0%,#0E1120 100%)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{width:"100%",maxWidth:340}}>
        <div style={{textAlign:"center",marginBottom:36}}>
          <div style={{width:72,height:72,borderRadius:"50%",background:"linear-gradient(135deg,#F97316,#DC2626)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",fontSize:32}}>🍽</div>
          <h1 style={{fontSize:26,fontWeight:800,letterSpacing:"-0.02em"}}>GALEA</h1>
          <p style={{color:MUT,fontSize:12,marginTop:4}}>Sistema de gestión</p>
        </div>
        <div style={{background:CARD,border:"1px solid "+BORD,borderRadius:16,padding:24}}>
          <div style={{marginBottom:12}}>
            <p style={{color:MUT,fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:6}}>Usuario</p>
            <Fld value={nombre} onChange={setNombre} placeholder="Tu nombre de usuario" onKeyDown={onKey}/>
          </div>
          <div style={{marginBottom:20}}>
            <p style={{color:MUT,fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:6}}>Contraseña</p>
            <Fld value={pass} onChange={setPass} placeholder="••••••••" type="password" onKeyDown={onKey}/>
          </div>
          {error&&<div style={{background:RED+"22",border:"1px solid "+RED+"55",borderRadius:8,padding:"8px 12px",marginBottom:12}}>
            <p style={{color:RED,fontSize:12}}>{error}</p>
          </div>}
          <Btn onClick={doLogin} disabled={loading} style={{width:"100%",padding:13,fontSize:14,background:loading?"#333":"linear-gradient(135deg,#F97316,#DC2626)",border:"none"}}>
            {loading?"Verificando...":"Entrar"}
          </Btn>
        </div>
      </div>
    </div>
  );
}

const PM='Eres experto en menus de restaurante. Analiza la imagen y extrae todos los platillos/bebidas. Responde SOLO con JSON valido sin texto extra. Estructura: {"area":"string","items":[{"nombre":"string","descripcion":"string o null","precio":0,"categoria":"string"}]}';

function MenuScanner({areaId, recs, setRecs, info, onClose}){
  const [img,setImg]=useState(null),[b,setB]=useState(null),[loading,setLoading]=useState(false);
  const [res,setRes]=useState(null),[error,setError]=useState(null),[saved,setSaved]=useState(false);
  const fR=useRef(),cR=useRef();

  function hFile(file){if(!file)return;setImg(URL.createObjectURL(file));setRes(null);setError(null);b64file(file).then(setB);}

  async function analyze(){
    if(!b)return;setLoading(true);setError(null);
    try{
      const resp=await fetch(RAILWAY_URL+"/scan-menu",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image_base64:b,media_type:"image/jpeg",prompt:PM})});
      if(!resp.ok)throw new Error("Error "+resp.status);
      const data=await resp.json();
      if(data.error)throw new Error(data.error);
      const marked=data.items.map(it=>{
        const existing=recs.find(r=>r.nombre.toLowerCase()===it.nombre.toLowerCase());
        return{...it,existing:existing||null,sel:true,changed:existing&&existing.precio!==it.precio};
      });
      setRes({...data,items:marked});
    }catch(e){setError("No se pudo leer: "+e.message);}
    finally{setLoading(false);}
  }

  function aplicar(){
    if(!res)return;
    const selected=res.items.filter(it=>it.sel);
    // Actualizar precios existentes
    selected.filter(it=>it.existing&&it.changed).forEach(it=>{
      setRecs(prev=>prev.map(r=>r.id===it.existing.id?{...r,precio:it.precio}:r));
    });
    // Agregar nuevos
    const nuevos=selected.filter(it=>!it.existing);
    if(nuevos.length>0){
      const prefix=areaId==="vinos"?"VIN":areaId==="barra"?"BAR":areaId==="postres"?"POS":"PLT";
      setRecs(prev=>[...prev,...nuevos.map(it=>({id:prefix+String(uid()).padStart(3,"0"),nombre:it.nombre,cat:it.categoria||"Menu",precio:it.precio,lineas:[]}))]);
    }
    setSaved(true);
  }

  if(saved){
    return(
      <div style={{position:"fixed",inset:0,background:BG,zIndex:300,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
        <p style={{fontSize:48,marginBottom:16}}>✅</p>
        <p style={{fontWeight:800,fontSize:18,marginBottom:8}}>Menu actualizado</p>
        <p style={{color:MUT,fontSize:13,marginBottom:24,textAlign:"center"}}>Los cambios ya aparecen en tu lista de recetas</p>
        <Btn onClick={onClose}>Cerrar</Btn>
      </div>
    );
  }

  return(
    <div style={{position:"fixed",inset:0,background:BG,zIndex:300,overflowY:"auto"}}>
      <div style={{background:CARD,borderBottom:"1px solid "+BORD,padding:"14px 16px",position:"sticky",top:0,zIndex:301}}>
        <Row>
          <button onClick={onClose} style={{background:"none",border:"none",color:info.color,fontWeight:700,fontSize:14,cursor:"pointer"}}>← Cerrar</button>
          <span style={{fontWeight:700,fontSize:13}}>📸 Escanear Menú</span>
        </Row>
      </div>
      <div style={{padding:16}}>
        {!img&&<div>
          <div onClick={()=>cR.current.click()} style={{border:"2px dashed "+BORD,borderRadius:14,padding:"36px 20px",textAlign:"center",cursor:"pointer",background:CARD,marginBottom:10}}>
            <p style={{fontSize:40,marginBottom:8}}>📋</p>
            <p style={{fontWeight:700,fontSize:15,marginBottom:4}}>Fotografía el menú</p>
            <p style={{color:MUT,fontSize:12}}>El sistema lee los platillos y actualiza precios automáticamente</p>
          </div>
          <input ref={cR} type="file" accept="image/*" capture="environment" onChange={e=>hFile(e.target.files[0])} style={{display:"none"}}/>
          <Btn onClick={()=>fR.current.click()} outline style={{width:"100%",padding:12}}>Subir desde archivos</Btn>
          <input ref={fR} type="file" accept="image/*" onChange={e=>hFile(e.target.files[0])} style={{display:"none"}}/>
        </div>}
        {img&&!loading&&!res&&<div>
          <div style={{borderRadius:12,overflow:"hidden",marginBottom:12,border:"1px solid "+BORD}}><img src={img} alt="menu" style={{width:"100%",maxHeight:300,objectFit:"contain",background:"#000"}}/></div>
          <div style={{display:"flex",gap:8}}>
            <Btn outline onClick={()=>{setImg(null);setB(null);}} style={{flex:1}}>Cambiar</Btn>
            <Btn onClick={analyze} style={{flex:2}}>Leer con IA</Btn>
          </div>
        </div>}
        {loading&&<Ld color={info.color}/>}
        {error&&<Box bc={RED}><p style={{color:RED,fontSize:13}}>{error}</p></Box>}
        {res&&<div>
          <Box style={{marginBottom:12}}>
            <p style={{fontWeight:700,fontSize:14,marginBottom:4}}>{res.area||"Menú"}</p>
            <p style={{color:MUT,fontSize:12}}>{res.items.length} items detectados</p>
          </Box>
          {res.items.map((it,i)=>(
            <div key={i} onClick={()=>setRes(prev=>({...prev,items:prev.items.map((x,j)=>j===i?{...x,sel:!x.sel}:x)}))} style={{cursor:"pointer"}}>
              <Box bc={it.sel?(it.existing?BORD:GREEN):BORD} style={{marginBottom:8,opacity:it.sel?1:0.4}}>
                <Row>
                  <div style={{display:"flex",gap:8,alignItems:"center",flex:1}}>
                    <div style={{width:18,height:18,borderRadius:4,background:it.sel?ACC:SURF,border:"1px solid "+(it.sel?ACC:MUT),display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:BG,flexShrink:0}}>{it.sel?"✓":""}</div>
                    <div>
                      <p style={{fontWeight:700,fontSize:13}}>{it.nombre}</p>
                      {it.existing?<p style={{color:GREEN,fontSize:11}}>✓ Ya existe</p>:<p style={{color:GREEN,fontSize:11}}>Nuevo item</p>}
                    </div>
                  </div>
                  <p style={{fontWeight:800,fontSize:14}}>{fm(it.precio)}</p>
                </Row>
              </Box>
            </div>
          ))}
          <div style={{position:"sticky",bottom:16,marginTop:14}}>
            <Btn onClick={aplicar} style={{width:"100%",padding:16,fontSize:15}}>
              Aplicar {res.items.filter(it=>it.sel).length} cambios al menú
            </Btn>
          </div>
        </div>}
      </div>
    </div>
  );
}

function Dashboard({alm, subs, recs, setTab}){
  const [detRec,setDetRec]=useState(null);
  const al=alm.filter(a=>stSt(a)==="rep").length;
  const val=alm.reduce((s,a)=>s+a.precio*a.stock,0);

  if(detRec)return <DetalleReceta rec={detRec} alm={alm} subs={subs} onClose={()=>setDetRec(null)}/>;

  function KpiBtn({icon,label,value,color,dest}){
    return(
      <div onClick={()=>dest&&setTab(dest)} style={{flex:1,minWidth:0,background:CARD,border:"1px solid "+BORD,borderRadius:12,padding:14,cursor:dest?"pointer":"default"}}>
        <p style={{color:MUT,fontSize:10,fontWeight:600,textTransform:"uppercase",marginBottom:3}}>{icon} {label}</p>
        <p style={{color:color||ACC,fontSize:20,fontWeight:800}}>{value}</p>
        {dest&&<p style={{color:MUT,fontSize:9,marginTop:3}}>Ver →</p>}

    <div>

        <KpiBtn icon="🧪" label="Sub-Recetas" value={subs.length} color={PUR} dest="subs"/>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
        <KpiBtn icon="🍽" label="Platillos" value={recs.length} color={ACC} dest="recetas"/>
        <KpiBtn icon="⚠" label="Alertas" value={al} color={al>0?RED:GREEN} dest="almacen"/>
      </div>
      <Box style={{marginBottom:16}}>
        <p style={{color:MUT,fontSize:10,fontWeight:600,textTransform:"uppercase",marginBottom:3}}>💰 Valor en Almacen</p>
        <p style={{color:GREEN,fontSize:22,fontWeight:800}}>{fm(val)}</p>
      </Box>
      <p style={{color:MUT,fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>Ranking de Platillos</p>
      {recs.map(rec=>{
        const c=recCosto(rec,alm,subs),fc=rec.precio>0?c/rec.precio:0,mg=rec.precio-c,mgp=rec.precio>0?mg/rec.precio:0;
        return(
          <div key={rec.id} onClick={()=>setDetRec(rec)} style={{cursor:"pointer",marginBottom:8}}>
            <Box>
              <Row style={{marginBottom:6}}>
                <div>
                  <p style={{fontWeight:700,fontSize:13,marginBottom:4}}>{rec.nombre}</p>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}><Tag color={catC(rec.cat)}>{rec.cat}</Tag><Tag color={fcC(fc)}>{fcL(fc)}</Tag></div>
                </div>
                <div style={{textAlign:"right"}}>
                  <p style={{fontWeight:800,fontSize:15}}>{fm(rec.precio)}</p>
                  <p style={{color:ACC,fontSize:12,fontWeight:700}}>Costo: {fm(c)}</p>
                </div>
              </Row>
              <div style={{background:SURF,borderRadius:8,padding:"8px 10px"}}>
                <Row style={{marginBottom:6}}>
                  <span style={{fontSize:12,color:MUT}}>Food Cost:</span>
                  <span style={{fontSize:13,color:fcC(fc),fontWeight:800}}>{pc(fc)}</span>
                </Row>
                <div style={{borderTop:"1px solid "+BORD,paddingTop:6}}>
                  <Row>
                    <span style={{fontSize:12,color:MUT}}>Utilidad:</span>
                    <div style={{textAlign:"right"}}>
                      <span style={{fontSize:14,color:GREEN,fontWeight:800}}>{fm(mg)}</span>
                      <span style={{fontSize:12,color:GREEN,fontWeight:700,marginLeft:6}}>({pc(mgp)})</span>
                    </div>
                  </Row>
                </div>
                <p style={{color:MUT,fontSize:10,marginTop:4,textAlign:"right"}}>Toca para ver desglose →</p>
              </div>
            </Box>
          </div>
        );
      })}
      {al>0&&<div style={{marginTop:16}}>
        <p style={{color:RED,fontSize:11,fontWeight:700,textTransform:"uppercase",marginBottom:8}}>Reponer urgente</p>
        {alm.filter(a=>stSt(a)==="rep").map(a=><Box key={a.id} bc={RED} style={{marginBottom:6}}><Row><div><p style={{fontWeight:700,fontSize:13}}>{a.nombre}</p><p style={{color:MUT,fontSize:11}}>{a.prov}</p></div><p style={{color:RED,fontWeight:700,fontSize:13}}>Stock: {a.stock} {a.unidad}</p></Row></Box>)}
      </div>}
    </div>
  );
}

function Almacen({alm,setAlm,soloVer=false}){
  const [q,setQ]=useState("");
  const [provFilt,setProvFilt]=useState("");
  const [show,setShow]=useState(false);
  const [editing,setEditing]=useState(null);
  const [saving,setSaving]=useState(false);
  const [f,setF]=useState({nombre:"",cat:"Carnes",unidad:"kg",precio:"",stock:"",min:"",max:"",prov:""});
  const [ef,setEf]=useState({});
  const CATS=["Carnes","Mariscos","Verduras","Frutas","Lacteos","Abarrotes","Especias","Bebidas","Otro"];
  const UNITS=["kg","litro","pieza","gramo","ml","caja","bolsa","lata","manojo","docena"];
  const proveedores=[...new Set(alm.map(a=>a.prov).filter(Boolean))];
  const list=alm.filter(a=>{
    const mq=a.nombre.toLowerCase().includes(q.toLowerCase())||a.id.toLowerCase().includes(q.toLowerCase());
    const mp=!provFilt||a.prov===provFilt;
    return mq&&mp;
  });

  async function save(){
    if(!f.nombre||!f.precio)return; setSaving(true);
    try{
      const newId="ING"+String(uid()).padStart(3,"0");
      const obj={id:newId,nombre:f.nombre,cat:f.cat,unidad:f.unidad,precio:+f.precio,stock:+f.stock||0,min:+f.min||0,max:+f.max||0,prov:f.prov,updated:hoy()};
      await sb("ingredientes",{method:"POST",body:JSON.stringify(obj)});
      setAlm(prev=>[...prev,obj]); setF({nombre:"",cat:"Carnes",unidad:"kg",precio:"",stock:"",min:"",max:"",prov:""}); setShow(false);
    }catch(e){alert("Error: "+e.message);} finally{setSaving(false);}
  }
  function startEdit(a){if(soloVer)return;setEditing(a.id);setEf({nombre:a.nombre,cat:a.cat,unidad:a.unidad,precio:String(a.precio),stock:String(a.stock),min:String(a.min),max:String(a.max),prov:a.prov||""});}
  async function saveEdit(){
    if(!ef.precio)return; setSaving(true);
    try{
      const upd={nombre:ef.nombre,cat:ef.cat,unidad:ef.unidad,precio:+ef.precio,stock:+ef.stock||0,min:+ef.min||0,max:+ef.max||0,prov:ef.prov,updated:hoy()};
      await sb("ingredientes?id=eq."+editing,{method:"PATCH",body:JSON.stringify(upd)});
      setAlm(prev=>prev.map(a=>a.id===editing?{...a,...upd}:a)); setEditing(null);
    }catch(e){alert("Error: "+e.message);} finally{setSaving(false);}
  }
  async function deleteIng(id){
    setSaving(true);
    try{
      await sb("ingredientes?id=eq."+id,{method:"DELETE",prefer:"return=minimal"});
      setAlm(prev=>prev.filter(a=>a.id!==id)); setEditing(null);
    }catch(e){alert("Error: "+e.message);} finally{setSaving(false);}
  }

  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:8}}>
        <Fld value={q} onChange={setQ} placeholder="Buscar ingrediente..." style={{flex:1}}/>
        {!soloVer&&<Btn sm onClick={()=>setShow(!show)}>+ Nuevo</Btn>}
      </div>
      {proveedores.length>0&&<div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
        <button key="todos" onClick={()=>setProvFilt("")} style={{padding:"4px 10px",borderRadius:20,border:"none",background:!provFilt?ACC:SURF,color:!provFilt?"#fff":MUT,fontSize:11,cursor:"pointer",fontWeight:!provFilt?700:400}}>Todos</button>
        {proveedores.map((pv,i)=><button key={i} onClick={()=>setProvFilt(provFilt===pv?"":pv)} style={{padding:"4px 10px",borderRadius:20,border:"none",background:provFilt===pv?BLUE:SURF,color:provFilt===pv?"#fff":MUT,fontSize:11,cursor:"pointer",fontWeight:provFilt===pv?700:400}}>{pv}</button>)}
      </div>}
      {show&&!soloVer&&<Box bc={ACC} style={{marginBottom:14}}>
        <p style={{fontWeight:700,fontSize:13,color:ACC,marginBottom:10}}>+ Nuevo Ingrediente</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
          <Fld value={f.nombre} onChange={v=>setF({...f,nombre:v})} placeholder="Nombre *"/>
          <Sel value={f.cat} onChange={v=>setF({...f,cat:v})}>{CATS.map(c=><option key={c}>{c}</option>)}</Sel>
          <Fld value={f.precio} onChange={v=>setF({...f,precio:v})} placeholder="Precio *" type="number"/>
          <Sel value={f.unidad} onChange={v=>setF({...f,unidad:v})}>{UNITS.map(u=><option key={u}>{u}</option>)}</Sel>
          <Fld value={f.stock} onChange={v=>setF({...f,stock:v})} placeholder="Stock" type="number"/>
          <Fld value={f.prov} onChange={v=>setF({...f,prov:v})} placeholder="Proveedor"/>
          <Fld value={f.min} onChange={v=>setF({...f,min:v})} placeholder="Stock minimo" type="number"/>
          <Fld value={f.max} onChange={v=>setF({...f,max:v})} placeholder="Stock maximo" type="number"/>
        </div>
        <div style={{display:"flex",gap:8}}><Btn color={GREEN} onClick={save} style={{opacity:saving?0.5:1}}>{saving?"Guardando...":"Guardar"}</Btn><Btn outline onClick={()=>setShow(false)}>Cancelar</Btn></div>
      </Box>}
      <p style={{color:MUT,fontSize:11,marginBottom:8}}>{list.length} ingredientes{!soloVer?" - Toca para editar":""}</p>
      {list.map(a=>{
        const st=stSt(a),bc=st==="rep"?RED:st==="sob"?YEL:BORD,isEdit=editing===a.id;
        return(
          <Box key={a.id} bc={isEdit?ACC:bc} style={{marginBottom:8}}>
            {isEdit?(
              <div>
                <Row style={{marginBottom:10}}>
                  <p style={{fontWeight:700,fontSize:13,color:ACC}}>Editando: {a.id}</p>
                  <Btn sm outline onClick={()=>setEditing(null)}>Cancelar</Btn>
                </Row>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                  <Fld value={ef.nombre} onChange={v=>setEf({...ef,nombre:v})} placeholder="Nombre"/>
                  <Sel value={ef.cat} onChange={v=>setEf({...ef,cat:v})}>{CATS.map(c=><option key={c}>{c}</option>)}</Sel>
                  <Fld value={ef.precio} onChange={v=>setEf({...ef,precio:v})} placeholder="Precio *" type="number"/>
                  <Sel value={ef.unidad} onChange={v=>setEf({...ef,unidad:v})}>{UNITS.map(u=><option key={u}>{u}</option>)}</Sel>
                  <Fld value={ef.stock} onChange={v=>setEf({...ef,stock:v})} placeholder="Stock" type="number"/>
                  <Fld value={ef.prov} onChange={v=>setEf({...ef,prov:v})} placeholder="Proveedor"/>
                  <Fld value={ef.min} onChange={v=>setEf({...ef,min:v})} placeholder="Min" type="number"/>
                  <Fld value={ef.max} onChange={v=>setEf({...ef,max:v})} placeholder="Max" type="number"/>
                </div>
                <div style={{display:"flex",gap:8}}>
                  <Btn color={GREEN} onClick={saveEdit} style={{flex:2,opacity:saving?0.5:1}}>{saving?"Guardando...":"Guardar"}</Btn>
                  <Btn color={RED} onClick={()=>deleteIng(a.id)} style={{flex:1,opacity:saving?0.5:1}}>Eliminar</Btn>
                </div>
              </div>
            ):(
              <div onClick={()=>startEdit(a)} style={{cursor:soloVer?"default":"pointer"}}>
                <Row style={{marginBottom:6}}>
                  <div><p style={{fontWeight:700,fontSize:13,marginBottom:4}}>{a.nombre}</p><div style={{display:"flex",gap:6,flexWrap:"wrap"}}><Tag color={catC(a.cat)}>{a.cat}</Tag><span style={{color:MUT,fontSize:10,alignSelf:"center"}}>{a.id}</span>{a.updated&&<Tag color={ACC}>actualizado</Tag>}</div></div>
                  <div style={{textAlign:"right"}}><p style={{fontWeight:800,fontSize:15}}>{fm(a.precio)}</p><p style={{color:MUT,fontSize:11}}>/{a.unidad}</p></div>
                </Row>
                <Row style={{borderTop:"1px solid "+SURF,paddingTop:6}}>
                  <span style={{color:MUT,fontSize:11}}>Stock: <span style={{color:st==="rep"?RED:st==="sob"?YEL:GREEN,fontWeight:700}}>{a.stock} {a.unidad}</span></span>
                  <div style={{textAlign:"right"}}><span style={{color:MUT,fontSize:11,display:"block"}}>{a.prov||"Sin proveedor"}</span>{a.updated&&<span style={{color:ACC,fontSize:10,display:"block"}}>Act: {a.updated}</span>}</div>
                </Row>
              </div>
            )}
          </Box>
        );
      })}
    </div>
  );
}

function SubRecetas({subs,alm}){
  return(
    <div>
      {subs.map(sub=>{
        const tot=sub.ings.reduce((s,l)=>{const i=alm.find(a=>a.id===l.id);return s+(i?i.precio*l.q:0);},0);
        const cxu=sub.rend>0?tot/sub.rend:0;
        return(
          <Box key={sub.id} style={{marginBottom:12}}>
            <Row style={{marginBottom:8}}>
              <div><p style={{fontWeight:700,fontSize:14,marginBottom:4}}>{sub.nombre}</p><div style={{display:"flex",gap:6}}><Tag color={PUR}>{sub.tipo}</Tag><span style={{color:MUT,fontSize:10,alignSelf:"center"}}>{sub.id}</span></div></div>
              <div style={{textAlign:"right"}}><p style={{fontWeight:800,fontSize:15,color:PUR}}>{fm(cxu)}</p><p style={{color:MUT,fontSize:11}}>/{sub.u}</p></div>
            </Row>
            <div style={{background:SURF,borderRadius:8,padding:10}}>
              <p style={{color:MUT,fontSize:11,marginBottom:6,fontWeight:600}}>Rinde {sub.rend}{sub.u}</p>
              {sub.ings.map((l,i)=>{const ing=alm.find(a=>a.id===l.id);return <Row key={i} style={{padding:"3px 0",borderBottom:"1px solid "+BORD}}><span style={{fontSize:12}}>{ing?ing.nombre:l.id} <span style={{color:MUT}}>{l.q} {ing?ing.unidad:""}</span></span><span style={{fontSize:12,color:ACC}}>{fm(ing?ing.precio*l.q:0)}</span></Row>;})}
              <Row style={{marginTop:6}}><span style={{fontSize:12,color:MUT,fontWeight:600}}>Total lote</span><span style={{fontSize:13,fontWeight:700}}>{fm(tot)}</span></Row>
            </div>
          </Box>
        );
      })}
    </div>
  );
}

function DetalleReceta({rec,alm,subs,onClose}){
  const costo=recCosto(rec,alm,subs),fc=rec.precio>0?costo/rec.precio:0,mg=rec.precio-costo,mgp=rec.precio>0?mg/rec.precio:0;
  return(
    <div style={{position:"fixed",inset:0,background:BG,zIndex:200,overflowY:"auto",paddingBottom:40}}>
      <div style={{background:CARD,borderBottom:"1px solid "+BORD,padding:"14px 16px",position:"sticky",top:0,zIndex:201}}>
        <Row><button onClick={onClose} style={{background:"none",border:"none",color:ACC,fontWeight:700,fontSize:14,cursor:"pointer"}}>← Volver</button><Tag color={catC(rec.cat)}>{rec.cat}</Tag></Row>
        <p style={{fontWeight:800,fontSize:20,marginTop:8}}>{rec.nombre}</p>
        <p style={{color:MUT,fontSize:12}}>{rec.id}</p>
      </div>
      <div style={{padding:16}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
          {[["Precio Venta",fm(rec.precio),TEXT],["Costo Total",fm(costo),ACC],["Food Cost",pc(fc),fcC(fc)],["Margen Bruto",fm(mg),GREEN],["Margen %",pc(mgp),GREEN],["Clasificacion",fcL(fc),fcC(fc)]].map(item=>(
            <div key={item[0]} style={{background:CARD,border:"1px solid "+BORD,borderRadius:10,padding:12}}>
              <p style={{color:MUT,fontSize:10,fontWeight:600,textTransform:"uppercase",marginBottom:4}}>{item[0]}</p>
              <p style={{color:item[2],fontWeight:800,fontSize:16}}>{item[1]}</p>
            </div>
          ))}
        </div>
        <p style={{color:MUT,fontSize:11,fontWeight:700,textTransform:"uppercase",marginBottom:10}}>Desglose</p>
        {rec.lineas.map((l,i)=>{
          const isI=l.t==="ING",ing=isI?alm.find(a=>a.id===l.i):null,sub=!isI?subs.find(s=>s.id===l.i):null;
          const nm=isI?(ing?ing.nombre:l.i):(sub?sub.nombre:l.i);
          const cu=isI?(ing?ing.precio:0):subCosto(sub||{ings:[],rend:1},alm);
          const lc=cu*l.q,pp=costo>0?lc/costo:0;
          const stockOk=isI&&ing?ing.stock>ing.min:true;
          return(
            <div key={i} style={{background:CARD,border:"1px solid "+(isI&&ing&&!stockOk?RED:BORD),borderRadius:10,padding:12,marginBottom:8}}>
              <Row style={{marginBottom:6}}>
                <div style={{display:"flex",gap:6,alignItems:"center",flex:1,minWidth:0}}>
                  <span style={{fontSize:9,color:isI?ACC:PUR,background:isI?ACC+"22":PUR+"22",padding:"2px 6px",borderRadius:3,fontWeight:700,flexShrink:0}}>{l.t}</span>
                  <span style={{fontWeight:700,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{nm}</span>
                </div>
                <span style={{fontWeight:800,fontSize:14,color:ACC,flexShrink:0,marginLeft:8}}>{fm(lc)}</span>
              </Row>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                <div style={{background:SURF,borderRadius:7,padding:"6px 8px"}}><p style={{color:MUT,fontSize:9,fontWeight:600,textTransform:"uppercase",marginBottom:2}}>Cantidad</p><p style={{fontWeight:700,fontSize:13}}>{l.q} {isI?(ing?ing.unidad:""):(sub?sub.u:"")}</p></div>
                <div style={{background:SURF,borderRadius:7,padding:"6px 8px"}}><p style={{color:MUT,fontSize:9,fontWeight:600,textTransform:"uppercase",marginBottom:2}}>Costo unit.</p><p style={{fontWeight:700,fontSize:13}}>{fm(cu)}</p></div>
                <div style={{background:SURF,borderRadius:7,padding:"6px 8px"}}><p style={{color:MUT,fontSize:9,fontWeight:600,textTransform:"uppercase",marginBottom:2}}>% del costo</p><p style={{fontWeight:700,fontSize:13}}>{pc(pp)}</p></div>
                {isI&&ing&&<div style={{background:SURF,borderRadius:7,padding:"6px 8px"}}><p style={{color:MUT,fontSize:9,fontWeight:600,textTransform:"uppercase",marginBottom:2}}>Inventario</p><p style={{fontWeight:700,fontSize:13,color:stockOk?GREEN:RED}}>{ing.stock} {ing.unidad}</p></div>}
              </div>
              {isI&&ing&&!stockOk&&<div style={{marginTop:6,background:RED+"22",borderRadius:6,padding:"4px 8px"}}><span style={{color:RED,fontSize:11,fontWeight:600}}>Stock bajo</span></div>}
            </div>
          );
        })}
        <Box bc={GREEN} style={{marginTop:8}}>
          <Row style={{marginBottom:4}}><span style={{color:MUT,fontSize:13}}>Precio de venta</span><span style={{fontWeight:700,fontSize:15}}>{fm(rec.precio)}</span></Row>
          <Row style={{marginBottom:4}}><span style={{color:MUT,fontSize:13}}>Costo ingredientes</span><span style={{fontWeight:700,fontSize:15,color:ACC}}>- {fm(costo)}</span></Row>
          <div style={{borderTop:"1px solid "+BORD,paddingTop:8,marginTop:4}}>
            <Row><span style={{fontWeight:700,fontSize:14}}>Utilidad bruta</span><div style={{textAlign:"right"}}><span style={{fontWeight:800,fontSize:18,color:GREEN}}>{fm(mg)}</span><span style={{fontWeight:700,fontSize:14,color:GREEN,marginLeft:8}}>({pc(mgp)})</span></div></Row>
          </div>
        </Box>
      </div>
    </div>
  );
}

function Recetas({recs,alm,subs}){
  const [q,setQ]=useState(""),[cat,setCat]=useState("Todas"),[det,setDet]=useState(null);
  const list=recs.filter(r=>(cat==="Todas"||r.cat===cat)&&r.nombre.toLowerCase().includes(q.toLowerCase()));
  if(det)return <DetalleReceta rec={det} alm={alm} subs={subs} onClose={()=>setDet(null)}/>;
  return(
    <div>
      <Fld value={q} onChange={setQ} placeholder="Buscar platillo..." style={{marginBottom:10}}/>
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
        {["Todas","Entradas","Pastas","Principales"].map(c=><button key={c} onClick={()=>setCat(c)} style={{padding:"5px 12px",borderRadius:20,border:"none",background:cat===c?ACC:SURF,color:cat===c?"#fff":MUT,fontWeight:cat===c?700:500,fontSize:12,cursor:"pointer"}}>{c}</button>)}
      </div>
      <p style={{color:MUT,fontSize:11,marginBottom:10}}>Toca un elemento para ver el desglose completo</p>
      {list.map(rec=>{
        const c=recCosto(rec,alm,subs),fc=rec.precio>0?c/rec.precio:0,mg=rec.precio-c,mgp=rec.precio>0?mg/rec.precio:0;
        const stk=rec.lineas.some(l=>{if(l.t!=="ING")return false;const i=alm.find(a=>a.id===l.i);return i&&i.stock<=i.min;});
        return(
          <Box key={rec.id} bc={stk?RED:BORD} style={{marginBottom:10,cursor:"pointer"}} onClick={()=>setDet(rec)}>
            <Row style={{marginBottom:8}}>
              <div><p style={{fontWeight:700,fontSize:14,marginBottom:4}}>{rec.nombre}</p><div style={{display:"flex",gap:6,flexWrap:"wrap"}}><Tag color={catC(rec.cat)}>{rec.cat}</Tag><Tag color={fcC(fc)}>{fcL(fc)}</Tag>{stk&&<Tag color={RED}>Stock bajo</Tag>}</div></div>
              <div style={{textAlign:"right"}}><p style={{fontWeight:800,fontSize:15}}>{fm(rec.precio)}</p><p style={{color:fcC(fc),fontSize:12,fontWeight:700}}>FC {pc(fc)}</p><p style={{color:GREEN,fontSize:11,fontWeight:700}}>{fm(mg)} ({pc(mgp)})</p></div>
            </Row>
            <Row style={{borderTop:"1px solid "+SURF,paddingTop:6}}><span style={{color:MUT,fontSize:11}}>Costo: {fm(c)}</span><span style={{color:MUT,fontSize:12,fontWeight:600}}>Ver detalle →</span></Row>
          </Box>
        );
      })}
    </div>
  );
}

function PorPlatillo({recs,alm,subs}){
  const [sel,setSel]=useState(recs.length>0?recs[0].id:"");
  const rec=recs.find(r=>r.id===sel);
  const c=rec?recCosto(rec,alm,subs):0,fc=rec&&rec.precio>0?c/rec.precio:0,mg=rec?rec.precio-c:0;
  return(
    <div>
      <Box bc={ACC} style={{marginBottom:14}}>
        <p style={{color:MUT,fontSize:11,marginBottom:6}}>Selecciona platillo</p>
        <Sel value={sel} onChange={setSel} style={{fontWeight:700,fontSize:14,borderColor:ACC}}>{recs.map(r=><option key={r.id} value={r.id}>{r.id} - {r.nombre}</option>)}</Sel>
      </Box>
      {rec&&<div>
        <Box bc={fcC(fc)} style={{marginBottom:12}}>

function Movimientos({movs,setMovs,alm,setAlm}){

    try{
      const q=f.tipo==="SALIDA"?-Math.abs(+f.qty):+f.qty;
      const obj={fecha:hoy(),ing_id:f.ingId,tipo:f.tipo,qty:q,responsable:f.resp,obs:f.obs};
      const res=await sb("movimientos",{method:"POST",body:JSON.stringify(obj)});
      const saved=Array.isArray(res)?res[0]:res;
      setMovs(prev=>[...prev,{id:saved.id,fecha:saved.fecha,ingId:saved.ing_id,tipo:saved.tipo,qty:saved.qty,resp:saved.responsable,obs:saved.obs}]);
      const ing=alm.find(a=>a.id===f.ingId);
      if(ing){const ns=Math.max(0,ing.stock+q);await sb("ingredientes?id=eq."+f.ingId,{method:"PATCH",body:JSON.stringify({stock:ns})});setAlm(prev=>prev.map(a=>a.id===f.ingId?{...a,stock:ns}:a));}

          <Fld value={f.resp} onChange={v=>setF({...f,resp:v})} placeholder="Responsable"/>
          <Fld value={f.obs} onChange={v=>setF({...f,obs:v})} placeholder="Observaciones" style={{gridColumn:"1 / -1"}}/>
        </div>
        <div style={{display:"flex",gap:8}}><Btn color={GREEN} onClick={save} style={{opacity:saving?0.5:1}}>{saving?"Guardando...":"Guardar"}</Btn><Btn outline onClick={()=>setShow(false)}>Cancelar</Btn></div>

function Scanner({alm,setAlm}){
  const [img,setImg]=useState(null),[b,setB]=useState(null),[loading,setLoading]=useState(false);
  const [result,setResult]=useState(null),[pending,setPending]=useState([]),[error,setError]=useState(null),[applied,setApplied]=useState([]);
  const [mime,setMime]=useState("image/jpeg");
  const fR=useRef(),cR=useRef();
  function hFile(file){if(!file)return;setImg(URL.createObjectURL(file));setResult(null);setError(null);setPending([]);setMime(file.type||"image/jpeg");b64file(file).then(setB);}
  async function analyze(){
    if(!b)return;setLoading(true);setError(null);
    try{
      const resp=await fetch(RAILWAY_URL+"/scan-factura",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image_base64:b,media_type:mime})});
      if(!resp.ok)throw new Error("Error "+resp.status);
      const parsed=await resp.json();
      if(parsed.error)throw new Error(parsed.error);
      const upd=parsed.productos.map(p=>{const m=alm.find(a=>a.nombre.toLowerCase().split(" ")[0]===p.nombre.toLowerCase().split(" ")[0]);return{...p,matched:m||null,action:m?(m.precio!==p.precio_unitario?"update":"same"):"new",tid:"ING"+String(uid()).padStart(3,"0"),sel:true};});
      setResult(parsed);setPending(upd);

  }
  async function apply(){
    const ta=pending.filter(u=>u.sel&&u.action!=="same"),log=[];
    for(const x of ta){try{
      if(x.action==="update"&&x.matched){await sb("ingredientes?id=eq."+x.matched.id,{method:"PATCH",body:JSON.stringify({precio:x.precio_unitario,prov:result.proveedor,updated:hoy()})});setAlm(prev=>prev.map(a=>a.id===x.matched.id?{...a,precio:x.precio_unitario,prov:result.proveedor,updated:hoy()}:a));log.push({t:"u",n:x.matched.nombre,d:x.matched.precio,a:x.precio_unitario});}
      else if(x.action==="new"){const obj={id:x.tid,nombre:x.nombre,cat:x.categoria||"Otro",unidad:x.unidad,precio:x.precio_unitario,stock:x.cantidad,min:0,max:x.cantidad*3,prov:result.proveedor,updated:hoy()};await sb("ingredientes",{method:"POST",body:JSON.stringify(obj)});setAlm(prev=>[...prev,obj]);log.push({t:"n",n:x.nombre,p:x.precio_unitario});}

    <div>

      {!img&&<div>
        <div onClick={()=>fR.current.click()} style={{border:"2px dashed "+BORD,borderRadius:14,padding:"36px 20px",textAlign:"center",cursor:"pointer",background:CARD,marginBottom:10}}>
          <p style={{fontSize:40,marginBottom:8}}>📄</p><p style={{fontWeight:700,fontSize:15,marginBottom:4}}>Subir imagen de factura</p><p style={{color:MUT,fontSize:12}}>Ticket, factura o nota de entrega</p>
        </div>

        <Btn onClick={()=>cR.current.click()} style={{width:"100%",padding:14,fontSize:15}}>Tomar foto con cámara</Btn>
        <input ref={cR} type="file" accept="image/*" capture="environment" onChange={e=>hFile(e.target.files[0])} style={{display:"none"}}/>
      </div>}
      {img&&!loading&&!result&&<div>
        <div style={{borderRadius:12,overflow:"hidden",marginBottom:12,border:"1px solid "+BORD}}><img src={img} alt="f" style={{width:"100%",maxHeight:300,objectFit:"contain",background:"#000"}}/></div>
        <div style={{display:"flex",gap:8}}><Btn outline onClick={()=>{setImg(null);setB(null);}} style={{flex:1}}>Cambiar</Btn><Btn style={{flex:2}} onClick={analyze}>Analizar con IA</Btn></div>
      </div>}
      {loading&&<Ld/>}

      {result&&pending.length>0&&<div>
        <Box style={{marginBottom:12}}><Row style={{marginBottom:6}}><p style={{fontWeight:700,fontSize:14}}>{result.proveedor}</p>{result.fecha&&<Tag color={BLUE}>{result.fecha}</Tag>}</Row><div style={{display:"flex",gap:14}}><div><p style={{color:MUT,fontSize:10}}>Productos</p><p style={{fontWeight:700,fontSize:18,color:ACC}}>{result.productos.length}</p></div>{result.total_factura?<div><p style={{color:MUT,fontSize:10}}>Total</p><p style={{fontWeight:700,fontSize:18,color:GREEN}}>{fm(result.total_factura)}</p></div>:null}</div></Box>
        {pending.map((u,i)=>(
          <Box key={i} bc={u.action==="new"?GREEN:BORD} style={{marginBottom:8,opacity:u.action==="same"?0.5:1,cursor:u.action!=="same"?"pointer":"default"}} onClick={()=>{if(u.action!=="same")setPending(p=>p.map((x,j)=>j===i?{...x,sel:!x.sel}:x));}}>

            </Row>

          </Box>
        ))}
        <div style={{position:"sticky",bottom:16,marginTop:14}}>
          <Btn color={GREEN} onClick={apply} style={{width:"100%",padding:16,fontSize:15}}>Aplicar {pending.filter(u=>u.sel&&u.action!=="same").length} cambios al almacen</Btn>
        </div>
      </div>}
    </div>
  );
}

function Asistente({alm,subs,recs,movs,user}){
  const [msgs,setMsgs]=useState([{role:"assistant",content:"Hola "+user.nombre+", soy el asistente de Galea. ¿En qué puedo ayudarte?"}]);
  const [input,setInput]=useState(""),[loading,setLoading]=useState(false);
  const bottomRef=useRef();
  useEffect(()=>{if(bottomRef.current)bottomRef.current.scrollIntoView({behavior:"smooth"});},[msgs]);
  function ctx(){
    const alertas=alm.filter(a=>stSt(a)==="rep");
    const top=recs.map(r=>{const c=recCosto(r,alm,subs),fc=r.precio>0?c/r.precio:0;return{n:r.nombre,fc,mg:(r.precio-c).toFixed(2)};}).sort((a,b)=>a.fc-b.fc);
    const val=alm.reduce((s,a)=>s+a.precio*a.stock,0);
    return `Eres el asistente del restaurante Galea. Responde en español, conciso y útil.
Usuario: ${user.nombre} (${user.rol}). Ingredientes: ${alm.length} (valor $${val.toFixed(2)}). Sub-recetas: ${subs.length}. Platillos: ${recs.length}. Alertas: ${alertas.length} (${alertas.map(a=>a.nombre).join(", ")||"ninguno"}). Movimientos: ${movs.length}.
TOP 5: ${top.slice(0,5).map((r,i)=>`${i+1}. ${r.n} FC ${(r.fc*100).toFixed(1)}% Margen $${r.mg}`).join(" | ")}
PEOR: ${top.slice(-3).reverse().map(r=>`${r.n} ${(r.fc*100).toFixed(1)}%`).join(" | ")}`;
  }
  async function send(){
    const txt=input.trim();if(!txt||loading)return;
    const nm=[...msgs,{role:"user",content:txt}];
    setMsgs(nm);setInput("");setLoading(true);
    try{
      const resp=await fetch(RAILWAY_URL+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system:ctx(),messages:nm.map(m=>({role:m.role,content:m.content}))})});

      const data=await resp.json();
      setMsgs(prev=>[...prev,{role:"assistant",content:data.content}]);
    }catch(e){setMsgs(prev=>[...prev,{role:"assistant",content:"Error de conexión. Verifica el backend."}]);}
    finally{setLoading(false);}
  }
  return(
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 140px)"}}>
      <div style={{flex:1,overflowY:"auto",paddingBottom:12}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",marginBottom:10}}>
            <div style={{maxWidth:"82%",padding:"10px 13px",borderRadius:m.role==="user"?"12px 12px 3px 12px":"12px 12px 12px 3px",background:m.role==="user"?ACC:CARD,color:m.role==="user"?"#000":TEXT,fontSize:13,lineHeight:1.5,border:m.role==="user"?"none":"1px solid "+BORD,whiteSpace:"pre-wrap"}}>{m.content}</div>
          </div>
        ))}
        {loading&&<div style={{display:"flex",justifyContent:"flex-start",marginBottom:10}}><div style={{padding:"10px 14px",borderRadius:"12px 12px 12px 3px",background:CARD,border:"1px solid "+BORD}}><div style={{display:"flex",gap:5}}>{[0,1,2].map(i=><div key={i} style={{width:5,height:5,borderRadius:"50%",background:MUT,animation:"fadein 0.6s "+i*0.2+"s infinite alternate"}}/>)}</div></div></div>}
        <div ref={bottomRef}/>
      </div>
      <div style={{display:"flex",gap:8,paddingTop:10,borderTop:"1px solid "+BORD}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}} placeholder="Pregunta sobre inventario, costos, recetas..." style={{flex:1,background:SURF,border:"1px solid "+BORD,borderRadius:8,padding:"10px 12px",color:TEXT,fontSize:13,outline:"none"}}/>

              <Sel value={ef.rol} onChange={v=>setEf({...ef,rol:v})}><option value="admin">Admin</option><option value="chef">Chef</option><option value="compras">Compras</option><option value="vista">Vista</option></Sel>
              <div style={{display:"flex",alignItems:"center",gap:8,background:SURF,borderRadius:8,padding:"8px 10px",cursor:"pointer",gridColumn:"1/-1"}} onClick={()=>setEf({...ef,activo:!ef.activo})}>
                <div style={{width:18,height:18,borderRadius:4,background:ef.activo?GREEN:SURF,border:"1px solid "+(ef.activo?GREEN:BORD),display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#000"}}>{ef.activo?"✓":""}</div>
                <span style={{fontSize:12,color:ef.activo?TEXT:MUT}}>{ef.activo?"Usuario activo":"Inactivo — no puede entrar"}</span>
              </div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <Btn color={ACC} onClick={()=>guardar(u)} style={{flex:2,opacity:saving?0.5:1,color:"#000"}}>{saving?"Guardando...":"Guardar"}</Btn>
              {u.nombre!=="admin"&&<Btn color={RED} onClick={()=>eliminar(u.id)} style={{flex:1,opacity:saving?0.5:1}}>Eliminar</Btn>}
            </div>
          </div>:(
            <div onClick={()=>{setEditing(u.id);setEf({password:"",rol:u.rol,activo:u.activo});}} style={{cursor:"pointer"}}>
              <Row><div><p style={{fontWeight:700,fontSize:14,marginBottom:6}}>{u.nombre}</p><div style={{display:"flex",gap:6}}><Tag color={ROL_COLOR[u.rol]||BLUE}>{u.rol}</Tag><Tag color={u.activo?GREEN:RED}>{u.activo?"Activo":"Inactivo"}</Tag></div></div><p style={{color:MUT,fontSize:11}}>Editar →</p></Row>
            </div>
          )}
        </Box>);
      })}
    </div>
  );
}

const TABS_COCINA = [
  {id:"dashboard", ic:"📊", lb:"Dashboard"},
  {id:"ventas",    ic:"💰", lb:"Ventas"},
  {id:"almacen",   ic:"🏪", lb:"Almacen"},
  {id:"subs",      ic:"🧪", lb:"Sub-Rec."},
  {id:"recetas",   ic:"📋", lb:"Recetas"},
  {id:"platillo",  ic:"🍽", lb:"Platillo"},
  {id:"scanner",   ic:"📷", lb:"Facturas"},
  {id:"movs",      ic:"📦", lb:"Movim."},
  {id:"ai",        ic:"✦",  lb:"Asist."},
];

function AreaApp({areaId, setArea, alm, setAlm, subs, setSubs, recs, setRecs, movs, setMovs, user}){
  const info = AREAS.find(a=>a.id===areaId)||{nombre:"Area",icon:"🍽",color:ACC};
  const [tab,setTab] = useState("dashboard");
  const [showMenuScan,setShowMenuScan] = useState(false);
  const al = alm.filter(a=>stSt(a)==="rep").length;

  // Filtrar tabs según rol
  const permitidos = PERMISOS[user.rol]||[];
  const tabsVisibles = TABS_COCINA.filter(t=>permitidos.includes(t.id)||t.id==="dashboard");

  return(
    <div style={{minHeight:"100vh",background:BG,color:TEXT,paddingBottom:80}}>
      {/* Header del area */}
      <div style={{background:"linear-gradient(160deg,#0E1120 0%,#151929 100%)",borderBottom:"1px solid "+BORD,padding:"12px 16px",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <button onClick={()=>setArea(null)} style={{background:"none",border:"none",color:info.color,cursor:"pointer",fontSize:22,padding:"0 6px 0 0",lineHeight:1}}>←</button>
          <div style={{width:32,height:32,borderRadius:8,background:info.color+"22",border:"1px solid "+info.color+"33",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>{info.icon}</div>
          <div>
            <h1 style={{fontSize:15,fontWeight:800}}>{info.nombre}</h1>
            <p style={{fontSize:10,color:MUT}}>Inventario - Recetas - Costos</p>
          </div>
          <div style={{marginLeft:"auto",display:"flex",gap:8,alignItems:"center"}}>
            {/* Botón escanear menú */}
            <button onClick={()=>setShowMenuScan(true)} style={{background:info.color+"22",border:"1px solid "+info.color+"44",borderRadius:8,padding:"5px 10px",color:info.color,fontSize:11,fontWeight:700,cursor:"pointer"}}>📸 Menú</button>
            {al>0&&<div style={{background:RED+"22",border:"1px solid "+RED,borderRadius:20,padding:"3px 8px",fontSize:10,color:RED,fontWeight:700}}>⚠ {al}</div>}
          </div>
        </div>
      </div>

      {/* Menu Scanner Modal */}
      {showMenuScan&&<MenuScanner areaId={areaId} recs={recs} setRecs={setRecs} info={info} onClose={()=>setShowMenuScan(false)}/>}

      {/* Contenido */}
      <div style={{padding:"16px 16px 0"}} className="fade" key={tab}>
        {tab==="dashboard"&&<Dashboard alm={alm} subs={subs} recs={recs} setTab={setTab}/>}
        {tab==="almacen"&&<Almacen alm={alm} setAlm={setAlm} soloVer={user.rol==="vista"}/>}
        {tab==="subs"&&<SubRecetas subs={subs} alm={alm}/>}
        {tab==="recetas"&&<Recetas recs={recs} alm={alm} subs={subs}/>}
        {tab==="platillo"&&<PorPlatillo recs={recs} alm={alm} subs={subs}/>}
        {tab==="scanner"&&<Scanner alm={alm} setAlm={setAlm}/>}
        {tab==="movs"&&<Movimientos movs={movs} setMovs={setMovs} alm={alm} setAlm={setAlm}/>}
        {tab==="ai"&&<Asistente alm={alm} subs={subs} recs={recs} movs={movs} user={user}/>}
        {tab==="ventas"&&<div style={{textAlign:"center",padding:40}}><p style={{fontSize:32,marginBottom:12}}>💰</p><p style={{fontWeight:700,fontSize:16,marginBottom:8}}>Ventas</p><p style={{color:MUT,fontSize:13}}>Módulo disponible próximamente</p></div>}
      </div>

      {/* Nav bar */}
      <nav style={{position:"fixed",bottom:0,left:0,right:0,background:CARD,borderTop:"1px solid "+BORD,display:"flex",padding:"6px 2px",zIndex:50}}>
        {tabsVisibles.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,background:"none",border:"none",cursor:"pointer",padding:"4px 1px",color:tab===t.id?info.color:MUT}}>
            <span style={{fontSize:16}}>{t.ic}</span>
            <span style={{fontSize:8,fontWeight:tab===t.id?700:500}}>{t.lb}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

function AlmacenGlobal({alm,setAlm,setArea}){
  return(
    <div style={{minHeight:"100vh",background:BG,color:TEXT,paddingBottom:40}}>
      <div style={{background:"linear-gradient(160deg,#0E1120 0%,#151929 100%)",borderBottom:"1px solid "+BORD,padding:"12px 16px",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <button onClick={()=>setArea(null)} style={{background:"none",border:"none",color:BLUE,cursor:"pointer",fontSize:22,padding:"0 6px 0 0",lineHeight:1}}>←</button>
          <div style={{width:32,height:32,borderRadius:8,background:BLUE+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>🏪</div>
          <h1 style={{fontSize:15,fontWeight:800}}>Almacen General</h1>
        </div>
      </div>
      <div style={{padding:"16px 16px 0"}}><Almacen alm={alm} setAlm={setAlm}/></div>
    </div>
  );
}

function UsuariosPage({setArea}){
  return(
    <div style={{minHeight:"100vh",background:BG,color:TEXT,paddingBottom:40}}>
      <div style={{background:"linear-gradient(160deg,#0E1120 0%,#151929 100%)",borderBottom:"1px solid "+BORD,padding:"12px 16px",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <button onClick={()=>setArea(null)} style={{background:"none",border:"none",color:PUR,cursor:"pointer",fontSize:22,padding:"0 6px 0 0",lineHeight:1}}>←</button>
          <div style={{width:32,height:32,borderRadius:8,background:PUR+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>👥</div>
          <h1 style={{fontSize:15,fontWeight:800}}>Gestión de Usuarios</h1>
        </div>
      </div>
      <div style={{padding:"16px 16px 0"}}><Usuarios/></div>
    </div>
  );
}

function mapAlm(r){return{id:r.id,nombre:r.nombre,cat:r.cat,unidad:r.unidad,precio:Number(r.precio),stock:Number(r.stock),min:Number(r.min),max:Number(r.max),prov:r.prov||"",updated:r.updated||null};}
function mapSub(r,items){return{id:r.id,nombre:r.nombre,tipo:r.tipo,rend:Number(r.rend),u:r.u,ings:items.filter(i=>i.sub_id===r.id).map(i=>({id:i.ing_id,q:Number(i.cantidad)}))};}
function mapRec(r,lineas){return{id:r.id,nombre:r.nombre,cat:r.cat,precio:Number(r.precio),lineas:lineas.filter(l=>l.rec_id===r.id).map(l=>({t:l.tipo,i:l.ref_id,q:Number(l.cantidad)}))};}
function mapMov(r){return{id:r.id,fecha:r.fecha,ingId:r.ing_id,tipo:r.tipo,qty:Number(r.qty),resp:r.responsable||"",obs:r.obs||""};}

function App(){
  const [user,setUser] = useState(()=>{
    try{const s=sessionStorage.getItem("galea_user");return s?JSON.parse(s):null;}catch{return null;}
  });
  const [area,setArea] = useState(null);
  const [alm,setAlm] = useState([]);
  const [subs,setSubs] = useState([]);
  const [recs,setRecs] = useState([]);
  const [movs,setMovs] = useState([]);
  const [dataLoaded,setDataLoaded] = useState(false);
  const [dataError,setDataError] = useState(null);

  // Cargar datos de Supabase al hacer login
  useEffect(()=>{
    if(!user||dataLoaded)return;
    Promise.all([
      sb("ingredientes?select=*&order=id"),
      sb("sub_recetas?select=*&order=id"),
      sb("sub_receta_items?select=*"),
      sb("recetas?select=*&order=id"),
      sb("receta_lineas?select=*"),
      sb("movimientos?select=*&order=created_at"),
    ]).then(([almRows,subRows,subItems,recRows,recLineas,movRows])=>{
      setAlm((almRows||[]).map(mapAlm));
      setSubs((subRows||[]).map(r=>mapSub(r,subItems||[])));
      setRecs((recRows||[]).map(r=>mapRec(r,recLineas||[])));
      setMovs((movRows||[]).map(mapMov));
      setDataLoaded(true);
    }).catch(e=>setDataError(e.message));
  },[user]);

  function logout(){
    sessionStorage.removeItem("galea_user");
    setUser(null);setArea(null);setAlm([]);setSubs([]);setRecs([]);setMovs([]);setDataLoaded(false);
  }

  // Login
  if(!user)return <Login onLogin={u=>setUser(u)}/>;

  // Loading datos
  if(!dataLoaded&&!dataError)return(
    <div style={{minHeight:"100vh",background:BG,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}>
      <div style={{width:72,height:72,borderRadius:"50%",background:"linear-gradient(135deg,#F97316,#DC2626)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:32}}>🍽</div>
      <div style={{width:32,height:32,borderRadius:"50%",border:"2px solid #1A2035",borderTop:"2px solid #F97316",animation:"spin 0.7s linear infinite"}}/>
      <p style={{color:MUT,fontSize:13}}>Cargando datos...</p>
    </div>
  );

  if(dataError)return(
    <div style={{minHeight:"100vh",background:BG,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12,padding:24}}>
      <p style={{color:RED,fontWeight:700,textAlign:"center"}}>{dataError}</p>
      <Btn onClick={()=>window.location.reload()}>Reintentar</Btn>
    </div>
  );

  // Navegación por area
  if(area==="almacen_global")return <AlmacenGlobal alm={alm} setAlm={setAlm} setArea={setArea}/>;
  if(area==="usuarios")return <UsuariosPage setArea={setArea}/>;
  if(area&&AREAS.find(a=>a.id===area))return(
    <AreaApp areaId={area} setArea={setArea} alm={alm} setAlm={setAlm} subs={subs} setSubs={setSubs} recs={recs} setRecs={setRecs} movs={movs} setMovs={setMovs} user={user}/>
  );

  // HomeScreen
  return <HomeScreen alm={alm} recs={recs} setArea={setArea} user={user} onLogout={logout}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
